packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - workerd

overrides:
  # electron-builder's latest app-builder-lib pins old @electron/get -> global-agent
  # -> roarr -> unpatched sprintf-js. get 5 removes that vulnerable dependency chain.
  'app-builder-lib>@electron/get': '5.1.0'
  # Existing telemetry SDK uses the 2.x API peer; keep its patched major on refresh.
  "@opentelemetry/core": ">=2.8.0 <3"
  "js-yaml": ">=5.2.2"
  "undici": ">=7.28.0"
