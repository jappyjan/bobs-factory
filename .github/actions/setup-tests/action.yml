name: Set up workspace tests
description: Install Node, Bun, locked workspace dependencies and Linux test tools
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24.18.0'
        package-manager-cache: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'
    - uses: ./.github/actions/install-dependencies
    - name: Restore downloaded test tool packages
      uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: apt-debs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-tests/action.yml') }}
    - name: Install video, sandbox and release test tools
      shell: bash
      run: |
        set -euo pipefail
        # needrestart (a dpkg hook on the runner image) restarts services such as
        # php-fpm after the install and can block for 90 s or more. Test tools never
        # need a service restarted; sudo drops exported variables, so pass them through env.
        apt_get() {
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l NEEDRESTART_SUSPEND=1 \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@"
        }
        mkdir -p "$HOME/apt-archives"
        sudo cp -n "$HOME"/apt-archives/*.deb /var/cache/apt/archives/ 2> /dev/null || true
        apt_get update -qq
        # A stalled mirror connection can hang for minutes while a retry completes in
        # seconds (apt resumes partial downloads): bound each attempt and retry.
        for attempt in 1 2 3 4; do
          if timeout 90 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l NEEDRESTART_SUSPEND=1 \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --no-install-recommends -y \
            -o APT::Keep-Downloaded-Packages=true apparmor-profiles bubblewrap ffmpeg jq; then
            break
          fi
          [ "$attempt" = 4 ] && { echo 'Installing test tools failed four times' >&2; exit 1; }
          echo "::warning::Installing test tools timed out or failed (attempt $attempt); retrying"
          sudo dpkg --configure -a || true
        done
        sudo cp -n /var/cache/apt/archives/*.deb "$HOME/apt-archives/" 2> /dev/null || true
        sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
    - name: Verify Linux Exec sandbox prerequisites
      shell: bash
      run: |
        bwrap --version
        if ! bwrap --die-with-parent --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc -- /bin/true; then
          # Ubuntu 24.04 keeps this per-program policy opt-in. Preserve the
          # host-wide user namespace restrictions and use the distro profile,
          # which strips namespace capabilities from the sandboxed command.
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
        fi
        bwrap --die-with-parent --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc -- /bin/true
