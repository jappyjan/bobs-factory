name: Set up workspace tests
description: Install Node, Bun, locked workspace dependencies and Linux test tools
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24.18.0'
        package-manager-cache: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'
    - uses: ./.github/actions/install-dependencies
    - name: Install video, sandbox and release test tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y bubblewrap ffmpeg jq
    - name: Verify Linux Exec sandbox prerequisites
      shell: bash
      run: |
        bwrap --version
        bwrap --die-with-parent --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc -- /bin/true
