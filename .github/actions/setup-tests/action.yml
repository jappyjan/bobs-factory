name: Set up workspace tests
description: Install Node, Bun, locked workspace dependencies and Linux test tools
inputs:
  node-version:
    description: Node version to validate
    default: '24.18.0'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'
    - uses: ./.github/actions/install-dependencies
    - name: Install video and release test tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y ffmpeg jq
