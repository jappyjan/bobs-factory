name: Release / Build desktop
on:
  workflow_call:
    inputs:
      candidate_json:
        required: true
        type: string
      reuse_native:
        description: Reuse this caller run's completed canonical native matrix
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      candidate_json:
        description: Frozen candidate.json bytes (preparation only, never signing/publication)
        required: true
        type: string
permissions:
  contents: read
jobs:
  freeze:
    name: Validate frozen candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate_json: ${{ steps.freeze.outputs.candidate_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(inputs.candidate_json).candidate.workflowSha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - id: freeze
        name: Verify exact unsigned preparation source and tooling
        env:
          SOURCE_SHA: ${{ github.sha }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {validateCandidate} from './scripts/lib/release-candidate.mjs';
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const frozen=validateCandidate(JSON.parse(process.env.CANDIDATE_JSON));
          if(frozen.candidate.workflowSha!==head || head!==process.env.SOURCE_SHA)throw Error('Dispatch from the frozen tooling ref');
          appendFileSync(process.env.GITHUB_OUTPUT,'candidate_json='+JSON.stringify(frozen)+'\n');
          console.log(JSON.stringify({preparationOnly:true,publication:false,source:frozen.candidate.commit,tooling:head,digest:frozen.digest,version:frozen.candidate.version}));
          JS
  binary:
    name: Build CLI binaries
    if: inputs.reuse_native != true
    needs: freeze
    uses: ./.github/workflows/binary-build.yml
    with:
      candidate_json: ${{ needs.freeze.outputs.candidate_json }}
  desktop:
    # Nightly evidence accepts this prefix and target, including historical job names.
    name: desktop (${{ matrix.target }})
    if: always() && needs.freeze.result == 'success' && (needs.binary.result == 'success' || (inputs.reuse_native == true && needs.binary.result == 'skipped'))
    needs: [freeze, binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.workflowSha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify frozen preparation identity
        env:
          CANDIDATE_JSON: ${{ needs.freeze.outputs.candidate_json }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {validateCandidate} from './tooling/scripts/lib/release-candidate.mjs';
          const c=validateCandidate(JSON.parse(process.env.CANDIDATE_JSON));
          for(const [path,expected] of [['tooling',c.candidate.workflowSha],['source',c.candidate.commit]])if(execFileSync('git',['-C',path,'rev-parse','HEAD'],{encoding:'utf8'}).trim()!==expected)throw Error('Frozen checkout identity mismatch');
          writeFileSync(process.env.RUNNER_TEMP+'/candidate.json',process.env.CANDIDATE_JSON);
          JS
          corepack enable
          corepack prepare "$(node -p 'require("./source/package.json").packageManager')" --activate
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - run: pnpm --filter 'bobs-factory...' build
        working-directory: source
      - run: pnpm --filter bobs-factory-desktop test
        working-directory: source
      - uses: actions/download-artifact@v6
        with:
          name: bobs-factory-${{ matrix.target }}-${{ fromJSON(needs.freeze.outputs.candidate_json).digest }}
          path: ${{ runner.temp }}/runtime
      - name: Build desktop installers from the validated runtime bytes
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: |
          tar -xzf "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP/runtime"
          node tooling/scripts/build-desktop.mjs --source-root source --candidate "$RUNNER_TEMP/candidate.json" --runtime "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET" --output "$RUNNER_TEMP/desktop"
      - name: Validate isolated native user-service ownership
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: node source/scripts/native-service-smoke.mjs "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET" > "$RUNNER_TEMP/desktop/native-service-receipt.json"
      - name: Validate native Electron menu Stop and maintenance race
        timeout-minutes: 5
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        run: |
          export BOBS_FACTORY_DESKTOP_BINARY="$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET/bobs-factory"
          export BOBS_FACTORY_NATIVE_ELECTRON_RECEIPT="$RUNNER_TEMP/desktop/native-electron-receipt.json"
          export HOME="$RUNNER_TEMP/desktop-os-home"
          mkdir -p "$HOME"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a source/apps/desktop/node_modules/.bin/electron --no-sandbox source/apps/desktop/test/native-smoke.mjs > "$RUNNER_TEMP/desktop/native-electron-smoke.log" 2>&1
          else
            source/apps/desktop/node_modules/.bin/electron source/apps/desktop/test/native-smoke.mjs > "$RUNNER_TEMP/desktop/native-electron-smoke.log" 2>&1
          fi
      - name: Validate actual Linux complete shell upgrade and rollback
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ fromJSON(needs.freeze.outputs.candidate_json).candidate.version }}
          TARGET: ${{ matrix.target }}
        working-directory: source
        run: |
          xvfb-run -a node apps/desktop/test/native-shell-update.mjs "$RUNNER_TEMP/desktop/bobs-factory-desktop-$VERSION-linux-$(node -p 'process.arch').AppImage" "$RUNNER_TEMP/runtime/bobs-factory-$VERSION-$TARGET" "$RUNNER_TEMP/candidate.json" > "$RUNNER_TEMP/desktop/native-shell-update-pending.json"
          node ../tooling/scripts/verify-native-fixture-cleanup.mjs "$RUNNER_TEMP/desktop/native-shell-update-pending.json" "$RUNNER_TEMP/desktop/native-shell-update-receipt.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          # A rerun of this job replaces the partial upload of the attempt that failed.
          overwrite: true
          name: desktop-${{ matrix.target }}-${{ fromJSON(needs.freeze.outputs.candidate_json).digest }}
          path: |
            ${{ runner.temp }}/desktop/*.bobsapp.gz
            ${{ runner.temp }}/desktop/desktop-update-*.json
            ${{ runner.temp }}/desktop/*.dmg
            ${{ runner.temp }}/desktop/*.AppImage
            ${{ runner.temp }}/desktop/*.deb
            ${{ runner.temp }}/desktop/desktop-build.json
            ${{ runner.temp }}/desktop/native-service-receipt.json
            ${{ runner.temp }}/desktop/native-electron-receipt.json
            ${{ runner.temp }}/desktop/native-electron-smoke.log
            ${{ runner.temp }}/desktop/native-shell-update-receipt.json
            ${{ runner.temp }}/desktop/native-shell-update-pending.json
            ${{ runner.temp }}/runtime/*.tar.gz
