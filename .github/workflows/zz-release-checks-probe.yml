name: ZZ release checks probe (temporary, removed before merge)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/zz-release-checks-probe.yml']
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    outputs:
      candidate_json: ${{ steps.f.outputs.candidate_json }}
      ci_json: ${{ steps.f.outputs.ci_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - id: f
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync,readFileSync} from 'node:fs';
          import {freezeCandidate} from './scripts/lib/release-candidate.mjs';
          const sha=process.env.SHA;
          const c=freezeCandidate({channel:'nightly',commit:sha,workflowSha:sha,committedVersion:JSON.parse(readFileSync('apps/cli/package.json')).version,sequence:Number(process.env.GITHUB_RUN_ID),date:new Date().toISOString()});
          appendFileSync(process.env.GITHUB_OUTPUT,'candidate_json='+JSON.stringify(c)+'\n');
          appendFileSync(process.env.GITHUB_OUTPUT,'ci_json='+JSON.stringify({runId:1,runAttempt:1,event:'push',headSha:sha,conclusion:'success',url:'probe'})+'\n');
          JS
  checks:
    needs: freeze
    uses: ./.github/workflows/release-checks.yml
    with:
      candidate_json: ${{ needs.freeze.outputs.candidate_json }}
      ci_json: ${{ needs.freeze.outputs.ci_json }}
