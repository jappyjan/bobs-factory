name: Validate and upload Bob's Factory release evidence
on:
  workflow_run:
    workflows: ["Freeze eligible nightly or stable promotion"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_json:
        description: Exact frozen candidate.json from preparation
        required: true
        type: string
      binary_run_id:
        description: Successful four-native-target binary-build run at candidate
        required: true
        type: string
      evidence_url:
        description: HTTPS archive containing reviewed release-evidence receipts and source material; no secrets
        required: true
        type: string
      evidence_sha256:
        description: Independently reviewed SHA-256 of supplied release-evidence.tar.gz
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  automatic-nightly:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    # Verified full-source transfer took 56 minutes; allow intake and source assembly too.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - id: assemble
        name: Assemble actual nightly/beta source and CI evidence from the accepted baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BINARY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node scripts/prepare-nightly-evidence.mjs --run-id "$BINARY_RUN_ID" --output "$RUNNER_TEMP/release-evidence"
          if [ -f "$RUNNER_TEMP/release-evidence/candidate.json" ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const c=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/release-evidence/candidate.json")); appendFileSync(process.env.GITHUB_OUTPUT,"digest="+c.digest+"\n")'
          fi
      - uses: actions/upload-artifact@v6
        if: steps.assemble.outputs.digest != ''
        with:
          name: bobs-factory-release-evidence-${{ steps.assemble.outputs.digest }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
  evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(inputs.candidate_json).candidate.workflowSha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Validate exact workflow source and import reviewed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
          BINARY_RUN_ID: ${{ inputs.binary_run_id }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {validateCandidate} from "./scripts/lib/release-candidate.mjs"; const r=validateCandidate(JSON.parse(process.env.CANDIDATE_JSON)); if(r.candidate.workflowSha !== process.env.GITHUB_SHA) throw Error("Wrong workflow revision"); writeFileSync(process.env.RUNNER_TEMP+"/candidate.json",process.env.CANDIDATE_JSON)'
          source_sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/candidate.json")).candidate.commit')
          if ! git cat-file -e "$source_sha^{commit}"; then git fetch --no-tags --depth=1 origin "$source_sha"; fi
          node scripts/prepare-release-evidence.mjs --candidate "$RUNNER_TEMP/candidate.json" --run-id "$BINARY_RUN_ID" --url "$EVIDENCE_URL" --sha256 "$EVIDENCE_SHA256" --output "$RUNNER_TEMP/release-evidence"
      - uses: actions/upload-artifact@v6
        with:
          name: bobs-factory-release-evidence-${{ fromJSON(inputs.candidate_json).digest }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
