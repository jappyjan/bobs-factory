name: Release / 3. Publish
on:
  workflow_dispatch:
    inputs:
      evidence_artifact_id:
        description: Candidate-bound evidence artifact ID (prepare mode)
        type: string
      prepared_artifact_id:
        description: Exact reviewed prepared-release artifact ID (publication or recovery mode)
        type: string
      publish:
        description: Publish after separate approval; default is preparation only
        default: false
        type: boolean
      approved_assets_digest:
        description: Stable or beta, exact assetsDigest from the prepared publication plan
        type: string
  workflow_run:
    workflows: ["Release / 2. Collect evidence"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    name: Resolve validated inputs
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
      channel: ${{ steps.identity.outputs.channel }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - id: retrieve
        name: Retrieve retained prepared bytes or successful evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$EVIDENCE_RUN_ID" ]; then
            count=$(node --input-type=module -e 'import {githubClient} from "./scripts/lib/github-release.mjs"; const a=await githubClient().pages("actions/runs/"+process.env.EVIDENCE_RUN_ID+"/artifacts","artifacts"); console.log(a.filter(x=>x.name.startsWith("bobs-factory-release-evidence-")).length)')
            if [ "$count" = 0 ]; then echo 'No nightly evidence to publish.'; exit 0; fi
          fi
          if [ -n "$PREPARED_ARTIFACT_ID" ]; then
            node scripts/download-release-artifact.mjs --kind prepared --artifact-id "$PREPARED_ARTIFACT_ID" --output "$RUNNER_TEMP/input"
          elif [ -n "$EVIDENCE_RUN_ID" ]; then
            node scripts/download-release-artifact.mjs --kind evidence --run-id "$EVIDENCE_RUN_ID" --output "$RUNNER_TEMP/input"
          else
            node scripts/download-release-artifact.mjs --kind evidence --artifact-id "$EVIDENCE_ARTIFACT_ID" --output "$RUNNER_TEMP/input"
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Validate frozen execution and publication mode
        if: steps.retrieve.outputs.available == 'true'
        id: identity
        env:
          REQUEST_PUBLISH: ${{ inputs.publish }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          AUTOMATIC_NIGHTLIES: ${{ vars.BOBS_FACTORY_AUTOMATIC_NIGHTLIES }}
          TOOLING_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ENTRYPOINT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {validateCandidate} from './scripts/lib/release-candidate.mjs';
          const prepared=Boolean(process.env.PREPARED_ARTIFACT_ID);
          const r=validateCandidate(JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/input/'+(prepared?'assets/candidate.json':'candidate.json'))));
          if(process.env.GITHUB_EVENT_NAME==='workflow_run' && process.env.ENTRYPOINT_SHA !== r.candidate.workflowSha) throw Error('Automatic workflow advanced since evidence. Dispatch manually from frozen tooling ref.');
          if(r.candidate.workflowSha !== process.env.TOOLING_SHA) throw Error('Dispatch from the frozen tooling ref');
          const automatic=process.env.GITHUB_EVENT_NAME==='workflow_run' && r.candidate.channel==='nightly' && process.env.AUTOMATIC_NIGHTLIES==='enabled';
          const publish=automatic || process.env.REQUEST_PUBLISH==='true';
          if(publish && !automatic && !prepared) throw Error('Manual publication requires the exact reviewed prepared artifact');
          appendFileSync(process.env.GITHUB_OUTPUT,`digest=${r.digest}\nchannel=${r.candidate.channel}\npublish=${publish}\n`);
          JS
      - uses: actions/upload-artifact@v6
        if: steps.retrieve.outputs.available == 'true'
        with:
          name: release-input-${{ github.run_id }}
          path: ${{ runner.temp }}/input/
  prepare:
    name: Prepare immutable release assets
    if: needs.resolve.outputs.digest != ''
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-input-${{ github.run_id }}
          path: ${{ runner.temp }}/input
      - name: Prepare with read-only credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d "$RUNNER_TEMP/input/assets" ]; then
            mv "$RUNNER_TEMP/input" "$RUNNER_TEMP/public-release"
            run_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/public-release/assets/release.json")).buildRunId')
            node scripts/publish-binary-release.mjs --candidate "$RUNNER_TEMP/public-release/assets/candidate.json" --run-id "$run_id" --resume --output "$RUNNER_TEMP/public-release"
          else
            run_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/input/release-evidence.json")).buildRunId')
            node scripts/publish-binary-release.mjs --candidate "$RUNNER_TEMP/input/candidate.json" --run-id "$run_id" --evidence "$RUNNER_TEMP/input/release-evidence.json" --output "$RUNNER_TEMP/public-release"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bobs-factory-prepared-release-${{ needs.resolve.outputs.digest }}
          path: ${{ runner.temp }}/public-release/
          if-no-files-found: ignore
  publish:
    name: Publish approved assets
    needs: [resolve, prepare]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # Downloading the prepared release alone took 25 min on a slow day (run
    # 40558759720); a 30 min limit cancelled the job mid-publication.
    timeout-minutes: 90
    # All release mutations across versions/channels share this repository lock.
    concurrency:
      group: bobs-factory-repository-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: bobs-factory-prepared-release-${{ needs.resolve.outputs.digest }}
          path: ${{ runner.temp }}/public-release
      - name: Publish exact validated assets after rollout activation or candidate-bound stable/beta approval
        env:
          GH_TOKEN: ${{ github.token }}
          BOBS_FACTORY_AUTOMATIC_NIGHTLIES: ${{ vars.BOBS_FACTORY_AUTOMATIC_NIGHTLIES }}
          BOBS_FACTORY_RELEASE_PUBLICATION_LOCK: repository
          APPROVED_ASSETS_DIGEST: ${{ inputs.approved_assets_digest }}
          APPROVED_BY: ${{ github.actor }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          PUBLISH_RELEASE: ${{ needs.resolve.outputs.publish }}
        run: |
          candidate="$RUNNER_TEMP/public-release/assets/candidate.json"
          run_id=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/public-release/assets/release.json")).buildRunId')
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; const c=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/public-release/assets/candidate.json")); writeFileSync(process.env.RUNNER_TEMP+"/approval.json",JSON.stringify({candidateDigest:c.digest,assetsDigest:process.env.APPROVED_ASSETS_DIGEST,approvedBy:process.env.APPROVED_BY}))'
          args=()
          if [ "$PUBLISH_RELEASE" = true ]; then args+=(--publish); fi
          node scripts/publish-binary-release.mjs --candidate "$candidate" --run-id "$run_id" --resume --approval "$RUNNER_TEMP/approval.json" --output "$RUNNER_TEMP/public-release" "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bobs-factory-publication-receipt-${{ needs.resolve.outputs.digest }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-release/
          if-no-files-found: error
