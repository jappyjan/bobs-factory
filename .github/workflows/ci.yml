name: CI / Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: ./.github/actions/install-dependencies
      - name: Check formatting and code quality
        run: pnpm biome ci
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: Build and test (Node 24.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - name: Create test environment
        run: |
          cat > .env << EOF
          LINEAR_WEBHOOK_SECRET=test
          WEBHOOK_PORT=3000
          WORKSPACE_BASE_DIR=./tmp/workspaces
          PROMPT_TEMPLATE_PATH=./examples/prompt-template.txt
          ANTHROPIC_API_KEY=test
          EOF
      # Each TypeScript build checks its types before emitting on the supported Node 24 runtime.
      - name: Build workspace packages and dashboard
        run: pnpm build
      - name: Run workspace tests
        run: pnpm -r test:run
      - name: Verify installation and release safeguards
        run: node --test scripts/tests/*.test.mjs
