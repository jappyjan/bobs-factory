name: Release / 1. Build candidates
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Nightly or beta from main; stable promotion from a selected validated nightly
        type: choice
        options: [nightly, stable, beta]
        default: nightly
      version:
        description: Stable or beta version, e.g. 1.0.1-beta (nightly version is allocated once)
        type: string
      nightly_tag:
        description: Exact published nightly tag to promote (required for stable)
        type: string
      skip_cooldown:
        description: Skip nightly cooldown (six-hour delay only; manual nightly requests)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: Freeze eligible candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: bobs-factory-candidate-freeze
      cancel-in-progress: false
    outputs:
      candidate_json: ${{ steps.candidate.outputs.candidate_json }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Restore candidate on retry
        id: restore
        if: github.run_attempt != '1'
        # A full rerun cannot see the earlier attempt's artifacts (a partial rerun does
        # not rerun this job at all). Without a retained copy the candidate is derived
        # again from the same run id, creation date and workflow SHA, or fails closed.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bobs-factory-frozen-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Freeze eligibility and promotion source
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          VERSION: ${{ inputs.version }}
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          SKIP_COOLDOWN: ${{ inputs.skip_cooldown || false }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          if [ "$RESTORE_OUTCOME" = failure ]; then
            echo '::warning::The retained frozen candidate was unavailable; deriving the same candidate again from this run identity.'
          fi
          created=$(node --input-type=module -e 'import {githubClient} from "./scripts/lib/github-release.mjs"; console.log((await githubClient().api("actions/runs/"+process.env.GITHUB_RUN_ID)).created_at)')
          promotion_args=()
          if [ "$CHANNEL" = stable ]; then promotion_args=(--nightly-tag "$NIGHTLY_TAG"); fi
          if [ "$SKIP_COOLDOWN" = true ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$CHANNEL" != nightly ]; then
              echo 'skip_cooldown is available only for manual nightly dispatches' >&2
              exit 1
            fi
            promotion_args+=(--skip-cooldown)
          fi
          node scripts/prepare-release-candidate.mjs --channel "$CHANNEL" --version "$VERSION" "${promotion_args[@]}" --sequence "$GITHUB_RUN_ID" --date "$created" --workflow-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/candidate/candidate.json"
      - uses: actions/upload-artifact@v6
        with:
          # Later attempts replace the copy only with the candidate they validated
          # as identical to the retained one, or froze from the same run identity.
          overwrite: true
          name: bobs-factory-frozen-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: ignore
      - name: Retain candidate for the native matrix
        id: candidate
        run: |
          if [ -f "$RUNNER_TEMP/candidate/candidate.json" ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const c=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/candidate/candidate.json")); appendFileSync(process.env.GITHUB_OUTPUT,"candidate_json="+JSON.stringify(c)+"\n")'
            echo 'Nightly and beta CI derive evidence from the pinned accepted baseline and fresh checks; beta and stable publication require exact prepared-asset approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
  ci-gate:
    name: Require green CI for the frozen commit
    needs: prepare
    if: needs.prepare.outputs.candidate_json != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    outputs:
      ci_json: ${{ steps.gate.outputs.ci_json }}
    env:
      CANDIDATE_JSON: ${{ needs.prepare.outputs.candidate_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - id: gate
        name: Wait for or start CI / Validate for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$CANDIDATE_JSON" > "$RUNNER_TEMP/candidate.json"
          node scripts/release-ci-gate.mjs --candidate "$RUNNER_TEMP/candidate.json" --output "$RUNNER_TEMP/ci.json"
          echo "ci_json=$(cat "$RUNNER_TEMP/ci.json")" >> "$GITHUB_OUTPUT"
  binary:
    name: Build CLI binaries
    needs: [prepare, ci-gate]
    if: needs.prepare.outputs.candidate_json != ''
    uses: ./.github/workflows/binary-build.yml
    with:
      candidate_json: ${{ needs.prepare.outputs.candidate_json }}

  desktop:
    name: Build desktop installers
    needs: [prepare, ci-gate, binary]
    if: needs.prepare.outputs.candidate_json != '' && fromJSON(needs.prepare.outputs.candidate_json).candidate.channel != 'stable'
    uses: ./.github/workflows/desktop-build.yml
    with:
      candidate_json: ${{ needs.prepare.outputs.candidate_json }}
      reuse_native: true
  checks:
    name: Validate candidate workflows
    needs: [prepare, ci-gate]
    if: needs.prepare.outputs.candidate_json != '' && fromJSON(needs.prepare.outputs.candidate_json).candidate.channel != 'stable'
    uses: ./.github/workflows/release-checks.yml
    with:
      candidate_json: ${{ needs.prepare.outputs.candidate_json }}
      ci_json: ${{ needs.ci-gate.outputs.ci_json }}
