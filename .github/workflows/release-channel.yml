name: Release / 1. Build candidates
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Nightly or beta from main; stable promotion from a selected validated nightly
        type: choice
        options: [nightly, stable, beta]
        default: nightly
      version:
        description: Stable or beta version, e.g. 1.0.1-beta (nightly version is allocated once)
        type: string
      nightly_tag:
        description: Exact published nightly tag to promote (required for stable)
        type: string
      skip_cooldown:
        description: Skip nightly cooldown (six-hour delay only; manual nightly requests)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: Freeze eligible candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: bobs-factory-candidate-freeze
      cancel-in-progress: false
    outputs:
      candidate_json: ${{ steps.candidate.outputs.candidate_json }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Restore candidate on retry
        if: github.run_attempt != '1'
        uses: actions/download-artifact@v8
        with:
          name: bobs-factory-frozen-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Freeze eligibility and promotion source
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          VERSION: ${{ inputs.version }}
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
          SKIP_COOLDOWN: ${{ inputs.skip_cooldown || false }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          created=$(node --input-type=module -e 'import {githubClient} from "./scripts/lib/github-release.mjs"; console.log((await githubClient().api("actions/runs/"+process.env.GITHUB_RUN_ID)).created_at)')
          promotion_args=()
          if [ "$CHANNEL" = stable ]; then promotion_args=(--nightly-tag "$NIGHTLY_TAG"); fi
          if [ "$SKIP_COOLDOWN" = true ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$CHANNEL" != nightly ]; then
              echo 'skip_cooldown is available only for manual nightly dispatches' >&2
              exit 1
            fi
            promotion_args+=(--skip-cooldown)
          fi
          node scripts/prepare-release-candidate.mjs --channel "$CHANNEL" --version "$VERSION" "${promotion_args[@]}" --sequence "$GITHUB_RUN_ID" --date "$created" --workflow-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/candidate/candidate.json"
      - uses: actions/upload-artifact@v6
        if: github.run_attempt == '1'
        with:
          name: bobs-factory-frozen-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: ignore
      - name: Retain candidate for the native matrix
        id: candidate
        run: |
          if [ -f "$RUNNER_TEMP/candidate/candidate.json" ]; then
            node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const c=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/candidate/candidate.json")); appendFileSync(process.env.GITHUB_OUTPUT,"candidate_json="+JSON.stringify(c)+"\n")'
            echo 'Nightly and beta CI derive evidence from the pinned accepted baseline and fresh checks; beta and stable publication require exact prepared-asset approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
  binary:
    name: Build CLI binaries
    needs: prepare
    if: needs.prepare.outputs.candidate_json != ''
    uses: ./.github/workflows/binary-build.yml
    with:
      candidate_json: ${{ needs.prepare.outputs.candidate_json }}

  desktop:
    name: Build desktop installers
    needs: [prepare, binary]
    if: needs.prepare.outputs.candidate_json != '' && fromJSON(needs.prepare.outputs.candidate_json).candidate.channel != 'stable'
    uses: ./.github/workflows/desktop-build.yml
    with:
      candidate_json: ${{ needs.prepare.outputs.candidate_json }}
      reuse_native: true
  checks:
    name: Validate candidate workflows
    needs: prepare
    if: needs.prepare.outputs.candidate_json != '' && fromJSON(needs.prepare.outputs.candidate_json).candidate.channel != 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      F1_AGENT_MODE: mock
      F1_TESTED_COMMIT: ${{ fromJSON(needs.prepare.outputs.candidate_json).candidate.commit }}
      CANDIDATE_JSON: ${{ needs.prepare.outputs.candidate_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.prepare.outputs.candidate_json).candidate.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - name: Prepare candidate check logs
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-checks"
          echo "F1_EVIDENCE_DIR=$RUNNER_TEMP/nightly-checks" >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Run actual tests and owned mocked delivery workflows
        run: |
          pnpm -r test:run > "$RUNNER_TEMP/nightly-checks/tests.log" 2>&1
          node --test --test-concurrency=1 scripts/tests/*.test.mjs > "$RUNNER_TEMP/nightly-checks/release-tests.log" 2>&1
          pnpm --filter bobs-factory-edge-worker exec vitest run test/UpdateManager.test.ts test/UpdateMaintenance.test.ts test/FactoryServer.update-startup.test.ts > "$RUNNER_TEMP/nightly-checks/update-lifecycle.log" 2>&1
          node apps/f1/test-drives/assets/update-maintenance.mjs > "$RUNNER_TEMP/nightly-checks/update-maintenance.log" 2>&1
          bun run apps/f1/test-drives/assets/desktop-service-lifecycle.mjs > "$RUNNER_TEMP/nightly-checks/desktop-service-lifecycle.log" 2>&1
          node apps/f1/test-drives/assets/desktop-shell-update.mjs > "$RUNNER_TEMP/nightly-checks/desktop-shell-update.log" 2>&1
      - name: Validate localhost access and remote API-key lifecycle
        timeout-minutes: 2
        run: bun run apps/f1/test-drives/assets/localhost-noauth.ts > "$RUNNER_TEMP/nightly-checks/localhost-noauth.log" 2>&1
      - name: Validate mocked delivery, architecture and impact recovery
        timeout-minutes: 5
        run: |
          pnpm --filter bobs-factory-core exec tsx "$PWD/apps/f1/test-drives/assets/linear-publication-101.ts" > "$RUNNER_TEMP/nightly-checks/linear-delivery.log" 2>&1
          BOBS_FACTORY_MIGRATION_SOURCE_CAPACITY_DIRECTORY=$(mktemp -d) bun run apps/f1/test-drives/media/2026-10-11-architecture-decision-brief/f1-drive.ts > "$RUNNER_TEMP/nightly-checks/architecture.log" 2>&1
          bun run apps/f1/test-drives/assets/architecture-approval-continuation.mjs > "$RUNNER_TEMP/nightly-checks/architecture-continuation.log" 2>&1
          bun run apps/f1/test-drives/assets/impact-feedback-recovery.mjs > "$RUNNER_TEMP/nightly-checks/impact-feedback-recovery.log" 2>&1
          bun run apps/f1/test-drives/assets/workflow-stall-recovery.mjs >> "$RUNNER_TEMP/nightly-checks/impact-feedback-recovery.log" 2>&1
          bun run apps/f1/test-drives/assets/api-responsiveness.ts > "$RUNNER_TEMP/nightly-checks/api-responsiveness.log" 2>&1
      - name: Record only completed current checks
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {fileRecord,jsonBytes} from './scripts/lib/binary-release.mjs';
          import {validateCandidate} from './scripts/lib/release-candidate.mjs';
          const c=validateCandidate(JSON.parse(process.env.CANDIDATE_JSON)),dir=process.env.RUNNER_TEMP+'/nightly-checks';
          const logs=['tests.log','release-tests.log','update-lifecycle.log','update-maintenance.log','desktop-service-lifecycle.log','desktop-shell-update.log','localhost-noauth.log','linear-delivery.log','architecture.log','architecture-continuation.log','impact-feedback-recovery.log','api-responsiveness.log'].map(f=>fileRecord(dir+'/'+f,f));
          writeFileSync(dir+'/nightly-checks.json',jsonBytes({schemaVersion:1,status:'passed',mode:'mock/scripted',candidateDigest:c.digest,commit:c.candidate.commit,workflowSha:c.candidate.workflowSha,runId:Number(process.env.GITHUB_RUN_ID),logs}));
          JS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bobs-factory-nightly-checks-${{ fromJSON(needs.prepare.outputs.candidate_json).digest }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-checks/
          if-no-files-found: error
